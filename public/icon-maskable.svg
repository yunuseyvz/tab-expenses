<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tab">
  <!--
    Maskable variant. Android crops a maskable icon to whatever shape its
    launcher uses — a circle, a squircle, a rounded square — and anything
    outside the safe zone (the middle 80%, per spec) can be cut off. So this
    variant bleeds the ground to the full 64px square and pulls the mark in
    to about 60% of it, where nothing can reach it.

    The material is the same as public/favicon.svg and src/components/TabLogo.tsx
    — same four-stop gradient, sheen, hatch, darkened corner and rim — so a
    launcher showing this beside the plain icon never shows two different marks.
    Only the geometry differs: no rounded corner, and the strokes sit further in.
  -->
  <defs>
    <linearGradient id="base" x1="0.08" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#e59463" />
      <stop offset="0.38" stop-color="#d0713f" />
      <stop offset="0.78" stop-color="#ad5730" />
      <stop offset="1" stop-color="#8f4425" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.14" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4" />
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.09" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#fff" stroke-opacity="0.06" stroke-width="2" />
    </pattern>
    <radialGradient id="fall" cx="0.9" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#3a1608" stop-opacity="0.34" />
      <stop offset="1" stop-color="#3a1608" stop-opacity="0" />
    </radialGradient>
    <filter id="lift" x="-25%" y1="0" x2="0" y2="1" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="0.9" flood-color="#4a1a08" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="64" height="64" fill="url(#base)" />
  <rect width="64" height="64" fill="url(#hatch)" />
  <rect width="64" height="64" fill="url(#sheen)" />
  <rect width="64" height="64" fill="url(#fall)" />

  <g filter="url(#lift)">
    <g stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M22 23 L22.5 43" />
      <path d="M29 21.5 L29.7 44.5" />
      <path d="M36 22.5 L36.3 43.5" />
      <path d="M43 22 L43.6 44" />
      <path d="M19.5 46.5 L45 19" />
    </g>
  </g>
</svg>
